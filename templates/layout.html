{{define "layout"}}<!doctype html>
<html lang="en" data-theme="light-sand">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Sokin{{end}}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Sokin</a>
    <nav>
      <a href="/"{{if eq .Active "dashboard"}} class="on" aria-current="page"{{end}}>Dashboard</a>
      <a href="/write"{{if eq .Active "write"}} class="on" aria-current="page"{{end}}>Write</a>
      <a href="/tasks"{{if eq .Active "tasks"}} class="on" aria-current="page"{{end}}>Tasks</a> 
    </nav>
    <button type="button" id="theme-toggle" class="ghost" aria-label="Switch theme">Theme: <span id="theme-name">Ocean</span></button>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
